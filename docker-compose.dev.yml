version: '3.8'

services:
  # Development Next.js application
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: hoomanamini-blog-dev
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    networks:
      - blog-network
    command: npm run dev

  # Redis for development
  redis:
    image: redis:7-alpine
    container_name: hoomanamini-redis-dev
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    networks:
      - blog-network
    command: redis-server --appendonly yes

volumes:
  redis_dev_data:
    driver: local

networks:
  blog-network:
    driver: bridge
