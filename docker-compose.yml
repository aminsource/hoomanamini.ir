services:
  # Static blog site with Nginx
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hoomanamini-blog
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge
